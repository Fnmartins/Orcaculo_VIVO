# stripe-webhook: a Stripe nao envia JWT do Supabase, entao esta function
# roda sem verificacao de JWT (equivale ao deploy com --no-verify-jwt).
# criar-checkout-stripe e criar-portal-stripe usam o padrao (verify_jwt = true).
[functions.stripe-webhook]
verify_jwt = false

# admin-configurar-plano: exige JWT valido (default). A funcao ainda checa
# is_super_admin no perfil antes de tocar Stripe/banco (defesa em profundidade).
[functions.admin-configurar-plano]
verify_jwt = true

# admin-acessos: exige JWT valido (default). A funcao ainda checa
# is_super_admin no perfil antes de ler/gravar papeis (defesa em profundidade).
[functions.admin-acessos]
verify_jwt = true
